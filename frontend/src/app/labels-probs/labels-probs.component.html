<div class="table-scroll-wrapper">
    <table mat-table [dataSource]="dataSource" matSort (matSortChange)="announceSortChange($event)"
        class="mat-elevation-z8">

    <!-- Position Column -->
    <ng-container matColumnDef="position">
        <th mat-header-cell *matHeaderCellDef mat-sort-header sortActionDescription="Sort by position">
          No.
        </th>
        <td mat-cell *matCellDef="let element"> {{element.position}} </td>
      </ng-container>

    <!-- Label Column -->
    <ng-container matColumnDef="label">
    <th mat-header-cell *matHeaderCellDef mat-sort-header sortActionDescription="Sort by suggested label">
    Label
    </th>
    <td mat-cell *matCellDef="let element"> {{element.label}} </td>
    </ng-container>

    <!-- Probability Column -->
    <ng-container matColumnDef="probability">
    <th mat-header-cell *matHeaderCellDef mat-sort-header sortActionDescription="Sort by probability">
    Probability
    </th>
    <td mat-cell *matCellDef="let element"> {{element.probability}} </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>

</div>
